# Docker Compose packaging for the Node runtime. No database volume and no
# installer-owned storage: sessions are stateless cookies.
services:
  tapdeploy:
    build:
      context: .
      dockerfile: Dockerfile
    image: tapdeploy:local
    ports:
      - "8787:8787"
    environment:
      # Set these in a .env file next to compose.yaml (see .env.example).
      PUBLIC_ORIGIN: ${PUBLIC_ORIGIN:?set PUBLIC_ORIGIN}
      OAUTH_CLIENT_ID: ${OAUTH_CLIENT_ID:?set OAUTH_CLIENT_ID}
      OAUTH_CLIENT_SECRET: ${OAUTH_CLIENT_SECRET:?set OAUTH_CLIENT_SECRET}
    restart: unless-stopped
