name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Typecheck, lint, unit/contract and e2e tests
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      # A physical node_modules from npm ci; scripts/ensure-dev-deps.mjs leaves it alone.
      - run: npm ci

      - run: npm run typecheck
      - run: npm run lint
      - run: npm run build
      - run: npm test

      # The runtime contract tests repackage dist/, so rebuild before the e2e runs.
      - run: npm run build

      - run: npx playwright install --with-deps chromium

      - name: Playwright (Vite dev server)
        run: npm run test:e2e
      - name: Playwright (built Node server)
        run: npm run test:e2e
        env:
          PW_RUNTIME: node
      - name: Playwright (built Worker, wrangler dev --local)
        run: npm run test:e2e
        env:
          PW_RUNTIME: workers

      # Raw trace/HAR/storageState may contain sessions; never upload test results.
      - name: Package and scan public source and runtime archives
        run: |
          mkdir -p temp/release
          python3 scripts/source-fingerprint.py --repo . --output temp/release/source.json
          python3 scripts/package-public-artifact.py source --identity temp/release/source.json --output dist/releases/tapdeploy-source.zip
          python3 scripts/package-public-artifact.py runtime --identity temp/release/source.json --output dist/releases/tapdeploy-runtime.zip
          python3 scripts/scan-public-artifact.py dist/releases/tapdeploy-source.zip
          python3 scripts/scan-public-artifact.py dist/releases/tapdeploy-runtime.zip

      - name: Upload scanned public archives
        uses: actions/upload-artifact@v4
        with:
          name: tapdeploy-public
          path: |
            dist/releases/tapdeploy-source.zip
            dist/releases/tapdeploy-source.manifest.json
            dist/releases/tapdeploy-runtime.zip
            dist/releases/tapdeploy-runtime.manifest.json
          if-no-files-found: error
          retention-days: 7
